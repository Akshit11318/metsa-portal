user nginx;user nginx;

worker_processes auto;worker_processes auto;

error_log /var/log/nginx/error.log warn;error_log /var/log/nginx/error.log warn;

pid /var/run/nginx.pid;pid /var/run/nginx.pid;



events {events {

    worker_connections 1024;    worker_connections 1024;

}}



http {http {

    include /etc/nginx/mime.types;    include /etc/nginx/mime.types;

    default_type application/octet-stream;    default_type application/octet-stream;



    log_format main '$remote_addr - $remote_user [$time_local] "$request" '    log_format main '$remote_addr - $remote_user [$time_local] "$request" '

                    '$status $body_bytes_sent "$http_referer" '                    '$status $body_bytes_sent "$http_referer" '

                    '"$http_user_agent" "$http_x_forwarded_for"';                    '"$http_user_agent" "$http_x_forwarded_for"';



    access_log /var/log/nginx/access.log main;    access_log /var/log/nginx/access.log main;



    sendfile on;    sendfile on;

    tcp_nopush on;    tcp_nopush on;

    tcp_nodelay on;    tcp_nodelay on;

    keepalive_timeout 65;    keepalive_timeout 65;

    types_hash_max_size 2048;    types_hash_max_size 2048;

    client_max_body_size 10M;    client_max_body_size 10M;



    # Gzip compression    # Gzip compression

    gzip on;    gzip on;

    gzip_vary on;    gzip_vary on;

    gzip_proxied any;    gzip_proxied any;

    gzip_comp_level 6;    gzip_comp_level 6;

    gzip_types text/plain text/css text/xml text/javascript     gzip_types text/plain text/css text/xml text/javascript 

               application/json application/javascript application/xml+rss                application/json application/javascript application/xml+rss 

               application/rss+xml font/truetype font/opentype                application/rss+xml font/truetype font/opentype 

               application/vnd.ms-fontobject image/svg+xml;               application/vnd.ms-fontobject image/svg+xml;



    # Define upstream servers    # Backend upstream

    upstream backend {    upstream backend {

        server metsa-backend:5000;        server metsa-backend:5000;

    }    }



    upstream frontend {    # Frontend upstream  

        server metsa-frontend:80;    upstream frontend {

    }        server metsa-frontend:80;

    }

    server {

        listen 4556;    server {

        server_name _;        listen 4556;

        server_name _;

        # Security headers

        add_header X-Frame-Options "SAMEORIGIN" always;        # Logging for debugging

        add_header X-Content-Type-Options "nosniff" always;        access_log /var/log/nginx/access.log main;

        add_header X-XSS-Protection "1; mode=block" always;        error_log /var/log/nginx/error.log warn;

        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Security headers

        # Health check        add_header X-Frame-Options "SAMEORIGIN" always;

        location /health {        add_header X-Content-Type-Options "nosniff" always;

            access_log off;        add_header X-XSS-Protection "1; mode=block" always;

            return 200 "nginx OK\n";        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            add_header Content-Type text/plain;

        }        # Nginx health check endpoint

        location /health {

        # API requests go to backend            access_log off;

        # NO trailing slash to preserve full path: /api/login stays /api/login            return 200 "nginx OK\n";

        location /api {            add_header Content-Type text/plain;

            proxy_pass http://backend;        }

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;        # API requests - proxy to backend on port 5000

            proxy_set_header Connection 'upgrade';        # Important: NO trailing slash on proxy_pass to preserve the full path

            proxy_set_header Host $host;        location /api {

            proxy_set_header X-Real-IP $remote_addr;            proxy_pass http://backend:5000;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;            proxy_http_version 1.1;

            proxy_set_header X-Forwarded-Proto $scheme;            

            proxy_cache_bypass $http_upgrade;            # WebSocket support

        }            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection 'upgrade';

        # Uploads from backend            

        location /uploads {            # Pass original host and client info

            proxy_pass http://backend;            proxy_set_header Host $host;

            proxy_set_header Host $host;            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Real-IP $remote_addr;            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;            proxy_set_header X-Forwarded-Proto $scheme;

        }            proxy_set_header X-Forwarded-Host $host;

            

        # Frontend application            # Don't buffer for better real-time response

        location / {            proxy_buffering off;

            proxy_pass http://frontend;            proxy_cache_bypass $http_upgrade;

            proxy_http_version 1.1;            

            proxy_set_header Upgrade $http_upgrade;            # Timeouts

            proxy_set_header Connection 'upgrade';            proxy_connect_timeout 60s;

            proxy_set_header Host $host;            proxy_send_timeout 60s;

            proxy_set_header X-Real-IP $remote_addr;            proxy_read_timeout 60s;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;        }

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache_bypass $http_upgrade;        # Uploads - serve from backend

        }        location /uploads {

    }            proxy_pass http://backend:5000;

}            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Cache uploaded files
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Frontend application - proxy to frontend on port 80
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            
            # WebSocket support for HMR in development
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_cache_bypass $http_upgrade;
        }
    }
}
